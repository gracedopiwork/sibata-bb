  <text class="sm" x="520" y="242">Ya / Tidak</text>

  <path class="arrow" d="M1015,112 V190 H200 V210"/>
  <path class="arrow" d="M200,232 H240"/>
  <path class="arrow" d="M410,232 H450"/>

