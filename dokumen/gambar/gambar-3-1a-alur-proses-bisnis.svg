<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="28" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" font-weight="bold" fill="#111">Gambar 3.1a  Alur proses bisnis SITABA-BB</text>
  <style>
    .box { fill:#f7f7f7; stroke:#111; stroke-width:1.4; }
    .start { fill:#111; }
    .lbl { font-family:Times New Roman, serif; font-size:12px; fill:#111; text-anchor:middle; }
    .sm { font-family:Times New Roman, serif; font-size:11px; fill:#111; text-anchor:middle; }
    .arrow { stroke:#111; stroke-width:1.4; fill:none; marker-end:url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>

  <ellipse cx="90" cy="90" rx="48" ry="22" class="box"/>
  <text class="lbl" x="90" y="94">Mulai</text>

  <rect x="180" y="68" width="150" height="44" rx="4" class="box"/>
  <text class="lbl" x="255" y="86">Terima berkas</text>
  <text class="sm" x="255" y="102">Tahap II / BA</text>

  <rect x="370" y="68" width="160" height="44" rx="4" class="box"/>
