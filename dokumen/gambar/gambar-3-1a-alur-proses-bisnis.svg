  <text class="sm" x="130" y="394">per item BB</text>

  <rect x="260" y="348" width="150" height="68" rx="4" class="box"/>
  <text class="lbl" x="335" y="376">Jenis putusan</text>
  <text class="sm" x="335" y="392">4 opsi eksekusi</text>

  <rect x="450" y="320" width="130" height="36" rx="4" class="box"/>
  <text class="sm" x="515" y="342">Dimusnahkan</text>
  <rect x="600" y="320" width="130" height="36" rx="4" class="box"/>
  <text class="sm" x="665" y="342">Dikembalikan</text>
  <rect x="450" y="372" width="130" height="36" rx="4" class="box"/>
  <text class="sm" x="515" y="394">Dirampas / lelang</text>
  <rect x="600" y="372" width="130" height="36" rx="4" class="box"/>
  <text class="sm" x="665" y="394">PSP</text>

  <rect x="770" y="360" width="150" height="44" rx="4" class="box"/>
  <text class="lbl" x="845" y="378">Catat eksekusi</text>
  <text class="sm" x="845" y="394">BA + foto bukti</text>

  <ellipse cx="1000" cy="382" rx="52" ry="22" class="box"/>
  <text class="lbl" x="1000" y="386">Selesai</text>

  <path class="arrow" d="M520,266 V300 H130 V360"/>
  <text class="sm" x="500" y="292">Tidak / setelah kembali</text>
  <path class="arrow" d="M935,254 V300 H130"/>
  <path class="arrow" d="M220,382 H260"/>
  <path class="arrow" d="M410,382 H450"/>
  <path class="arrow" d="M730,338 H800 V360"/>
  <path class="arrow" d="M730,390 H770"/>
  <path class="arrow" d="M920,382 H948"/>

  <text x="550" y="470" text-anchor="middle" font-family="Times New Roman, serif" font-size="12" fill="#333">Keterangan: satu stiker QR menempel pada unit fisik (BB mandiri atau wadah paket). Putusan dicatat per rincian isi.</text>
  <text x="550" y="494" text-anchor="middle" font-family="Times New Roman, serif" font-size="11" fill="#555">Sumber: spesifikasi SITABA-BB Kejaksaan Negeri Wajo · Seksi PB3R</text>

  <rect x="40" y="520" width="1020" height="78" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="56" y="544" font-family="Times New Roman, serif" font-size="12" font-weight="bold">Jalur pencatatan</text>
  <text x="56" y="564" font-family="Times New Roman, serif" font-size="12">Portal web: administrasi, cetak label, ekspor register.</text>
  <text x="56" y="582" font-family="Times New Roman, serif" font-size="12">Bot Telegram: /tambah, /pinjam, /kembali, /eksekusi, /cari, /rekap  setelah Chat ID masuk daftar putih.</text>
</svg>
