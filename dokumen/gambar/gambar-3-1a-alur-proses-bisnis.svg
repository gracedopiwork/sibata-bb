  <text class="sm" x="1015" y="102">+ mutasi CHECK_IN</text>
  <path class="arrow" d="M910,52 H980 V68"/>
  <path class="arrow" d="M910,128 H980 V112"/>

  <rect x="40" y="210" width="160" height="44" rx="4" class="box"/>
  <text class="lbl" x="120" y="228">Cetak label QR</text>
  <text class="sm" x="120" y="244">70 × 50 mm</text>

  <rect x="240" y="210" width="170" height="44" rx="4" class="box"/>
  <text class="lbl" x="325" y="228">Tempel stiker</text>
  <text class="sm" x="325" y="244">pada unit / wadah</text>

  <rect x="450" y="198" width="140" height="68" rx="4" class="box"/>
