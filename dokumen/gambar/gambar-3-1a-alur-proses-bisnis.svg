  <text class="sm" x="635" y="98">SINGLE / PACK</text>
  <polygon points="635,56 700,90 635,124 570,90" fill="none"/>

  <path class="arrow" d="M138,90 H180"/>
  <path class="arrow" d="M330,90 H370"/>
  <path class="arrow" d="M530,90 H570"/>

  <rect x="760" y="30" width="150" height="44" rx="4" class="box"/>
  <text class="lbl" x="835" y="48">BB mandiri</text>
  <text class="sm" x="835" y="64">Kode BB-YYYY-XXX</text>

  <rect x="760" y="106" width="150" height="44" rx="4" class="box"/>
  <text class="lbl" x="835" y="124">Paket/wadah</text>
  <text class="sm" x="835" y="140">Kode PKT + isi</text>

  <path class="arrow" d="M700,78 H760"/>
  <path class="arrow" d="M700,102 H760"/>
