<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" font-weight="bold">Gambar 3.1d  Diagram aktivitas UML (swimlane) SITABA-BB</text>
  <style>
