<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo SIBATA-BB Kejaksaan Negeri Wajo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98a"/>
      <stop offset=".45" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8a6d14"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16325a"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <path id="arcTop" d="M86,256 A170,170 0 0 1 426,256"/>
    <path id="arcBot" d="M78,256 A178,178 0 0 0 434,256"/>
    <path id="arcLeft" d="M118,368 A168,168 0 0 1 118,144"/>
    <path id="arcRight" d="M394,144 A168,168 0 0 1 394,368"/>
  </defs>

  <circle cx="256" cy="256" r="250" fill="#f7f4ea"/>
  <circle cx="256" cy="256" r="246" fill="url(#navy)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#e8c547" stroke-width="1.4"/>
  <circle cx="256" cy="256" r="204" fill="#fffdf6"/>

  <text fill="#e8c547" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">KEJAKSAAN NEGERI WAJO</textPath>
  </text>
  <text fill="#e8c547" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="1.6">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">BARANG BUKTI DAN BARANG RAMPASAN</textPath>
  </text>
  <text fill="#e8c547" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" letter-spacing="1.4">
    <textPath href="#arcLeft" startOffset="50%" text-anchor="middle">SEKSI PENGELOLAAN</textPath>
  </text>
  <text fill="#e8c547" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" letter-spacing="2">
    <textPath href="#arcRight" startOffset="50%" text-anchor="middle">(PB3R)</textPath>
  </text>

  <!-- brick pillars -->
  <g fill="#f0d789" stroke="#b8922a" stroke-width="1.2">
    <rect x="148" y="126" width="72" height="18" rx="2"/>
    <rect x="148" y="146" width="34" height="16"/>
    <rect x="186" y="146" width="34" height="16"/>
    <rect x="148" y="164" width="72" height="16"/>
    <rect x="292" y="126" width="72" height="18" rx="2"/>
    <rect x="292" y="146" width="34" height="16"/>
    <rect x="330" y="146" width="34" height="16"/>
    <rect x="292" y="164" width="72" height="16"/>
  </g>
  <path d="M168 180 C168 180 256 128 344 180" fill="none" stroke="#0b1f3a" stroke-width="14" stroke-linecap="round"/>
  <path d="M168 180 C168 180 256 128 344 180" fill="none" stroke="#c9a227" stroke-width="3"/>

  <!-- S and B -->
  <text x="168" y="286" text-anchor="middle" fill="#0b1f3a" font-family="Georgia, serif" font-size="92" font-weight="700">S</text>
  <text x="344" y="286" text-anchor="middle" fill="#0b1f3a" font-family="Georgia, serif" font-size="92" font-weight="700">B</text>

  <!-- QR -->
  <g transform="translate(232 148)" fill="#0b1f3a">
    <rect width="8" height="8"/><rect x="10" width="8" height="8"/><rect x="30" width="8" height="8"/>
    <rect y="10" width="8" height="8"/><rect x="30" y="10" width="8" height="8"/>
    <rect y="20" x="10" width="8" height="8"/><rect x="20" y="20" width="8" height="8"/>
    <rect y="30" width="8" height="8"/><rect x="20" y="30" width="8" height="8"/><rect x="30" y="30" width="8" height="8"/>
  </g>

  <!-- gavel -->
  <g transform="translate(196 214) rotate(-28)">
    <rect x="0" y="10" width="38" height="12" rx="3" fill="#0b1f3a"/>
    <rect x="14" y="22" width="8" height="36" rx="2" fill="#0b1f3a"/>
    <rect x="-4" y="6" width="46" height="6" rx="2" fill="#c9a227"/>
  </g>
  <!-- phone -->
  <g transform="translate(268 208)">
    <rect x="0" y="0" width="34" height="56" rx="7" fill="#fff" stroke="#c9a227" stroke-width="3"/>
    <circle cx="17" cy="28" r="8" fill="#0b1f3a"/>
    <path d="M14 28 L17 20 L20 28 L17 26 Z" fill="#e8c547"/>
  </g>

  <!-- ribbon -->
  <path d="M118 318 C150 304 362 304 394 318 L378 356 C340 342 172 342 134 356 Z" fill="#f4efe0" stroke="#c9a227" stroke-width="2"/>
  <text x="256" y="344" text-anchor="middle" fill="#0b1f3a" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="2">SIBATA-BB</text>
  <text x="256" y="378" text-anchor="middle" fill="#0b1f3a" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-weight="700" letter-spacing="1.4">SISTEM TATA KELOLA</text>
  <text x="256" y="394" text-anchor="middle" fill="#0b1f3a" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-weight="700" letter-spacing="1.4">BARANG BUKTI</text>
</svg>
